<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orca Tape Measure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
     <main>

    <h1>Orca Tape Measure</h1>

    <p class="intro">
      What is smaller than an Orca? What is larger? Click to find out.
    </p>

    <!-- This picture gets swapped out by script.js -->
    <img id="animal-photo" src="images/orca.jpg" alt="A photo of an Orca">

    <!-- This text gets rewritten by script.js -->
    <h2 id="animal-name">Orca</h2>
    <p id="animal-length">8 meters long</p>

    <!-- The two buttons, side by side -->
    <div class="button-row">
      <button id="smaller-button">&larr; Smaller</button>
      <button id="larger-button">Larger &rarr;</button>
    </div>

  </main>

    <script src="script.js"></script>
</body>
</html>
